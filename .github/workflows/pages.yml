name: Deploy learn.hara-lang.org

on:
  push:
    branches: [main, testing]
    paths:
      - "content/**"
      - "database/**"
      - "netlify/**"
      - "public/**"
      - "registry/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "astro.config.mjs"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-learn-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Validate publication and functions
        run: npm run check

      - name: Deploy testing to learn.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: npx --yes netlify-cli deploy --build --prod --message "testing ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}

      - name: Deploy main to learn.hara-lang.org
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --build --prod --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}

      - name: Reconcile learn.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: learn.testing.hara-lang.org
          NETLIFY_LEGACY_DOMAIN: world.testing.hara-lang.org

      - name: Reconcile learn.hara-lang.org
        if: github.ref_name == 'main'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: learn.hara-lang.org
          NETLIFY_LEGACY_DOMAIN: world.hara-lang.org

      - name: Verify testing Learn, session handoff, and profile publisher
        if: github.ref_name == 'testing'
        run: bash .github/scripts/verify-learn-site.sh
        env:
          LEARN_ORIGIN: https://learn.testing.hara-lang.org
          IDENTITY_ORIGIN: https://id.testing.hara-lang.org
          REQUIRE_IDENTITY_CONFIGURED: "true"
          REQUIRE_LEARN_AUTH_CONFIGURED: "true"
          REQUIRE_PROFILE_PUBLISHER_CONFIGURED: "true"

      - name: Verify production Learn, session handoff, and profile publisher
        if: github.ref_name == 'main'
        run: bash .github/scripts/verify-learn-site.sh
        env:
          LEARN_ORIGIN: https://learn.hara-lang.org
          IDENTITY_ORIGIN: https://id.hara-lang.org
          REQUIRE_IDENTITY_CONFIGURED: "true"
          REQUIRE_LEARN_AUTH_CONFIGURED: "true"
          REQUIRE_PROFILE_PUBLISHER_CONFIGURED: "true"
