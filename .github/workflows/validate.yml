name: Validate Hara World

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: hara-world-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Validate deployment scripts
        run: bash -n .github/scripts/*.sh
      - name: Validate reviewed registries
        run: |
          npm run sources:check
          npm run profiles:check
          npm run agents:check
      - run: npm test
      - run: npm run build
