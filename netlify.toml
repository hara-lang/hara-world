[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  HARA_LEARN_SITE = "https://learn.hara-lang.org"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev -- --host 0.0.0.0"
  targetPort = 4321
  port = 8888
framework = "#custom"

[[redirects]]
  from = "https://world.hara-lang.org/*"
  to = "https://learn.hara-lang.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://world.testing.hara-lang.org/*"
  to = "https://learn.testing.hara-lang.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/runtime/*"
  to = "https://hara-lang.org/runtime/:splat"
  status = 200

[[redirects]]
  from = "/docs-assets/*"
  to = "https://hara-lang.org/docs-assets/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/feed.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/agents.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/sources.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/sources.opml"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
